name: Bug report
description: Something is broken or behaves unexpectedly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug. Please include enough detail to reproduce it.
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: 1. Start the app… 2. POST /api/v1/… 3. Observe…
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Java / Maven versions
      placeholder: Java 21, Maven 3.9
