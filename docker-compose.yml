services:
  valkey:
    image: valkey/valkey:8.0-alpine
    container_name: verilogic-valkey
    ports:
      - "6379:6379"
    command: valkey-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    container_name: verilogic-engine
    ports:
      - "8080:8080"
    environment:
      VALKEY_HOST: valkey
      VALKEY_PORT: "6379"
      TRUST_FORWARDED_HEADERS: "false"
      CORS_ALLOWED_ORIGINS: http://localhost:8080
    depends_on:
      valkey:
        condition: service_healthy
